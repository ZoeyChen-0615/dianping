server:
  port: 8081
spring:
  application:
    name: hmdp
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/hmdp?useSSL=false&serverTimezone=UTC
    username: root
    password: 123456
  redis:
    host: localhost
    port: 6379
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
    database: 6
  jackson:
    default-property-inclusion: non_null # Ignore null fields in JSON serialization
  rabbitmq:
    host: localhost
    port: 5672 # AMQP protocol port; 15672 is the management UI port, do not mix them up
    username: guest
    password: guest
    virtual-host: /
    listener:
      simple:
        concurrency: 10
        max-concurrency: 10
        prefetch: 1
        auto-startup: true
        default-requeue-rejected: true
    template:
      retry:
        enabled: true
        initial-interval: 1000ms
        max-attempts: 3
        max-interval: 10000ms
        multiplier: 1
# Sender mailbox config: if unconfigured, the code is printed to the console log and written to Redis;
# fetch it via: redis-cli -n 6 get "login:code:<email>" — login still works
hmdp:
  mail:
    user: ""      # Sender QQ mailbox, e.g. yourmail@qq.com
    password: ""  # QQ Mail SMTP auth code (16 chars: mailbox Settings -> Accounts -> enable SMTP)
mybatis-plus:
  type-aliases-package: com.hmdp.entity # MyBatis type-alias scan package
logging:
  level:
    com.hmdp: debug
