server:
  port: 8081
spring:
  application:
    name: hmdp
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/hmdp?useSSL=false&serverTimezone=UTC
    username: root
    password: 123456
  redis:
    host: localhost
    port: 6379
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
    database: 6
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
  rabbitmq:
    host: localhost
    port: 5672 # AMQP 协议端口；15672 是管理界面端口，不要填错
    username: guest
    password: guest
    virtual-host: /
    listener:
      simple:
        concurrency: 10
        max-concurrency: 10
        prefetch: 1
        auto-startup: true
        default-requeue-rejected: true
    template:
      retry:
        enabled: true
        initial-interval: 1000ms
        max-attempts: 3
        max-interval: 10000ms
        multiplier: 1
# 发件邮箱配置：本地没有配的话，验证码会打印在控制台日志并写入 Redis，
# 用 redis-cli -n 6 get "login:code:<邮箱>" 即可取到，不影响登录流程
hmdp:
  mail:
    user: ""      # 发件 QQ 邮箱，例如 yourmail@qq.com
    password: ""  # QQ 邮箱 SMTP 授权码（16 位，邮箱设置 -> 账户 -> 开启 SMTP 获取）
mybatis-plus:
  type-aliases-package: com.hmdp.entity # 别名扫描包
logging:
  level:
    com.hmdp: debug
