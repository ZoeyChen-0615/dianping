<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Dianping</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { background:#f2f2f2; font-family:-apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; color:#333; font-size:14px; }
  #app { max-width:480px; margin:0 auto; background:#f7f7f7; min-height:100vh; position:relative; box-shadow:0 0 20px rgba(0,0,0,.08); padding-bottom:64px; }
  header.top { position:sticky; top:0; z-index:10; background:linear-gradient(135deg,#ff5a1f,#ff7a3d); color:#fff; padding:14px 16px; display:flex; align-items:center; justify-content:space-between; }
  header.top h1 { font-size:18px; font-weight:700; }
  header.top .sub { font-size:11px; opacity:.85; margin-top:2px; }
  header.top button { background:rgba(255,255,255,.2); border:none; color:#fff; border-radius:16px; padding:6px 12px; font-size:12px; cursor:pointer; }
  #view { padding:12px 12px 20px; }
  nav.tabs { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px; background:#fff; border-top:1px solid #eee; display:flex; z-index:10; }
  nav.tabs button { flex:1; border:none; background:none; padding:9px 0 10px; font-size:11px; color:#999; cursor:pointer; }
  nav.tabs button .ico { font-size:21px; display:block; margin-bottom:2px; }
  nav.tabs button.on { color:#ff5a1f; font-weight:600; }
  .card { background:#fff; border-radius:12px; padding:14px; margin-bottom:12px; box-shadow:0 1px 4px rgba(0,0,0,.05); }
  .chips { display:flex; gap:8px; overflow-x:auto; padding:4px 2px 10px; }
  .chips button { flex:0 0 auto; border:1px solid #eee; background:#fff; border-radius:18px; padding:8px 14px; font-size:13px; cursor:pointer; }
  .chips button.on { background:#ff5a1f; border-color:#ff5a1f; color:#fff; }
  .shop { display:flex; gap:12px; padding:12px 0; border-bottom:1px solid #f3f3f3; cursor:pointer; }
  .shop:last-child { border-bottom:none; }
  .shop .pic { width:84px; height:84px; border-radius:10px; background:linear-gradient(135deg,#ffd9c7,#ffb59a); flex:0 0 auto; display:flex; align-items:center; justify-content:center; font-size:30px; overflow:hidden; }
  .shop .pic img { width:100%; height:100%; object-fit:cover; }
  .shop .nm { font-size:15px; font-weight:600; margin-bottom:4px; }
  .shop .meta { font-size:12px; color:#999; line-height:1.7; }
  .shop .score { color:#ff5a1f; font-weight:700; }
  .blog { cursor:pointer; }
  .blog .ph { height:150px; border-radius:10px; background:linear-gradient(135deg,#ffe3d3,#ffc9ad); display:flex; align-items:center; justify-content:center; font-size:44px; margin-bottom:10px; }
  .blog .t { font-size:15px; font-weight:600; margin-bottom:6px; line-height:1.5; }
  .blog .meta { font-size:12px; color:#999; display:flex; gap:12px; }
  .content-html { line-height:1.8; font-size:14px; }
  .content-html br { display:block; }
  .btn { display:block; width:100%; border:none; border-radius:10px; padding:13px; font-size:15px; cursor:pointer; background:#ff5a1f; color:#fff; font-weight:600; }
  .btn.ghost { background:#fff; color:#ff5a1f; border:1px solid #ff5a1f; }
  .btn:disabled { opacity:.5; }
  .btn.sm { width:auto; display:inline-block; padding:8px 18px; font-size:13px; }
  input.inp { width:100%; border:1px solid #e5e5e5; border-radius:10px; padding:12px; font-size:14px; margin-bottom:10px; outline:none; }
  input.inp:focus { border-color:#ff5a1f; }
  .row { display:flex; gap:8px; }
  .row .inp { flex:1; }
  .hint { font-size:12px; color:#999; line-height:1.7; margin-top:8px; }
  .hint code { background:#f3f3f3; padding:1px 6px; border-radius:4px; font-size:11px; }
  #toast { position:fixed; bottom:80px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,.75); color:#fff; padding:10px 18px; border-radius:20px; font-size:13px; opacity:0; transition:opacity .25s; pointer-events:none; z-index:99; max-width:86%; text-align:center; }
  #toast.show { opacity:1; }
  .sec-t { font-size:15px; font-weight:700; margin:4px 0 10px; }
  .kv { display:flex; justify-content:space-between; font-size:13px; padding:7px 0; border-bottom:1px dashed #f0f0f0; }
  .kv:last-child { border:none; }
  .kv .k { color:#999; }
  .voucher { border:1px dashed #ffb59a; border-radius:10px; padding:12px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .voucher .vt { font-weight:600; font-size:14px; margin-bottom:4px; }
  .voucher .vp { font-size:12px; color:#999; }
  .voucher .vp b { color:#ff5a1f; font-size:16px; }
  .empty { text-align:center; color:#bbb; padding:40px 0; font-size:13px; }
  .back { border:none; background:none; color:#ff5a1f; font-size:14px; cursor:pointer; padding:4px 0; margin-bottom:8px; }
  #mask { position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; z-index:50; align-items:flex-end; justify-content:center; }
  #mask.show { display:flex; }
  #sheet { background:#fff; width:100%; max-width:480px; border-radius:16px 16px 0 0; padding:18px 16px 26px; }
  .me-head { display:flex; align-items:center; gap:12px; margin-bottom:12px; }
  .avatar { width:56px; height:56px; border-radius:50%; background:linear-gradient(135deg,#ff5a1f,#ff9a5a); color:#fff; display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:700; }
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div><h1>Dianping</h1><div class="sub" id="apiLine">localhost:8081</div></div>
    <button onclick="openSettings()">⚙ Settings</button>
  </header>
  <main id="view"></main>
  <nav class="tabs">
    <button id="tab-home" onclick="go('home')"><span class="ico">🏠</span>Home</button>
    <button id="tab-discover" onclick="go('discover')"><span class="ico">📝</span>Discover</button>
    <button id="tab-me" onclick="go('me')"><span class="ico">👤</span>Me</button>
  </nav>
</div>
<div id="toast"></div>
<div id="mask" onclick="if(event.target===this)closeSettings()"><div id="sheet"></div></div>
<script>
"use strict";
/* ---------- Base ---------- */
const store = {
  get api(){ return localStorage.getItem('hmdp_api') || 'http://localhost:8081'; },
  set api(v){ localStorage.setItem('hmdp_api', v); },
  get token(){ return localStorage.getItem('hmdp_token'); },
  set token(v){ v ? localStorage.setItem('hmdp_token', v) : localStorage.removeItem('hmdp_token'); }
};
let toastTimer = null;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}
async function api(path, {method='GET', body=null, auth=false} = {}){
  const headers = {};
  if (body) headers['Content-Type'] = 'application/json';
  if (auth){
    if (!store.token){ needLogin(); throw new Error('not logged in'); }
    headers['authorization'] = store.token;
  }
  let res;
  try { res = await fetch(store.api + path, {method, headers, body: body?JSON.stringify(body):undefined}); }
  catch(e){ toast('Cannot reach the backend — check the URL and that it is running'); throw e; }
  if (res.status === 401){ needLogin(); throw new Error('401'); }
  const json = await res.json();
  if (!json.success){ toast(json.errorMsg || 'Request failed'); throw new Error(json.errorMsg); }
  return json.data;
}
function needLogin(){ store.token = null; toast('Please log in first'); go('me'); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function listOf(d){ return Array.isArray(d) ? d : (d && d.records) ? d.records : []; }
/* ---------- Router ---------- */
let curTab = 'home';
function go(tab, param){
  curTab = tab;
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.remove('on'));
  document.getElementById('tab-'+tab).classList.add('on');
  document.getElementById('apiLine').textContent = store.api.replace(/^https?:\/\//,'');
  if (tab==='home') renderHome(param);
  else if (tab==='discover') renderDiscover(param);
  else renderMe();
}
/* ---------- Settings ---------- */
function openSettings(){
  const s = document.getElementById('sheet');
  s.innerHTML = `<div class="sec-t">Backend URL</div>
    <input class="inp" id="apiInput" value="${esc(store.api)}" placeholder="http://localhost:8081">
    <button class="btn" onclick="saveSettings()">Save</button>
    <div class="hint">Local backend default: <code>http://localhost:8081</code>. Opening this page directly in a browser (file://) works too — CORS is enabled on the backend.</div>`;
  document.getElementById('mask').classList.add('show');
}
function closeSettings(){ document.getElementById('mask').classList.remove('show'); }
function saveSettings(){
  const v = document.getElementById('apiInput').value.trim().replace(/\/$/,'');
  if (!v){ toast('URL must not be empty'); return; }
  store.api = v; closeSettings(); toast('Saved'); go(curTab);
}
/* ---------- Home ---------- */
const typeEmoji = n => /Food|Drink|Restaurant|Hotpot|Tea/.test(n) ? '🍜' : /KTV|Bar|Party/.test(n) ? '🎤' : /Beauty|Hair|Lash|Nail|SPA/.test(n) ? '💇' : /Fitness|Sport/.test(n) ? '🏋️' : /Massage|Foot/.test(n) ? '🦶' : /Kids|Family/.test(n) ? '🧸' : '🏪';
let curTypeId = null, curTypeName = '';
async function renderHome(param){
  const v = document.getElementById('view');
  if (param && param.shopId) return renderShopDetail(param.shopId);
  v.innerHTML = `<div class="sec-t">Categories</div><div class="chips" id="chips"><div class="empty">Loading…</div></div><div id="shopList"></div>`;
  try {
    const types = listOf(await api('/shop-type/list'));
    const box = document.getElementById('chips');
    box.innerHTML = types.map(t=>`<button data-id="${t.id}" onclick="pickType(${t.id},'${esc(t.name)}')">${typeEmoji(t.name)} ${esc(t.name)}</button>`).join('');
    if (types.length) pickType(types[0].id, types[0].name);
  } catch(e){ /* toast already shown */ }
}
async function pickType(id, name){
  curTypeId = id; curTypeName = name;
  document.querySelectorAll('#chips button').forEach(b=>b.classList.toggle('on', +b.dataset.id===+id));
  const box = document.getElementById('shopList');
  box.innerHTML = `<div class="card"><div class="sec-t">${esc(name)}</div><div id="shops"><div class="empty">Loading…</div></div></div>`;
  try {
    const shops = listOf(await api(`/shop/of/type?typeId=${id}&current=1`));
    document.getElementById('shops').innerHTML = shops.length ? shops.map(s=>`
      <div class="shop" onclick="go('home',{shopId:${s.id}})">
        <div class="pic">${s.images ? `<img src="${esc(s.images.split(',')[0])}" onerror="this.remove()">` : '🏪'}</div>
        <div><div class="nm">${esc(s.name)}</div>
        <div class="meta"><span class="score">${(s.score/10).toFixed(1)}</span> · ${s.sold} sold / mo · ${esc(s.area||'')}</div>
        <div class="meta">¥${s.avgPrice} / person · ${esc(s.address||'')}</div></div>
      </div>`).join('') : `<div class="empty">No shops in this category</div>`;
  } catch(e){}
}
async function renderShopDetail(id){
  const v = document.getElementById('view');
  v.innerHTML = `<button class="back" onclick="go('home')">‹ Back</button><div class="card"><div class="empty">Loading…</div></div>`;
  try {
    const s = await api(`/shop/${id}`);
    const vouchers = listOf(await api(`/voucher/list/${id}`)).filter(x=>x.status===1);
    v.innerHTML = `<button class="back" onclick="go('home')">‹ Back</button>
    <div class="card">
      <div class="sec-t" style="font-size:17px">${esc(s.name)}</div>
      <div class="kv"><span class="k">Rating</span><span class="score" style="color:#ff5a1f;font-weight:700">${(s.score/10).toFixed(1)}</span></div>
      <div class="kv"><span class="k">Avg. price</span><span>¥${s.avgPrice}</span></div>
      <div class="kv"><span class="k">Address</span><span>${esc(s.address||'-')}</span></div>
      <div class="kv"><span class="k">Hours</span><span>${esc(s.openHours||'-')}</span></div>
      <div class="kv"><span class="k">Sales / Reviews</span><span>${s.sold} / ${s.comments}</span></div>
    </div>
    <div class="card"><div class="sec-t">Vouchers</div><div id="vbox">${
      vouchers.length ? vouchers.map(x=>`
        <div class="voucher"><div><div class="vt">${esc(x.title)}</div>
        <div class="vp"><b>¥${(x.actualValue/100)}</b> voucher · Price ¥${(x.payValue/100)}${x.type===1?' · <span style="color:#ff5a1f">Flash sale</span>':''}</div></div>
        ${x.type===1?`<button class="btn sm" onclick="seckill(${x.id})">Grab it</button>`:''}</div>`).join('')
      : `<div class="empty">No vouchers</div>`}</div></div>`;
  } catch(e){}
}
async function seckill(voucherId){
  try { await api(`/voucher-order/seckill/${voucherId}`, {method:'POST', auth:true}); toast('Grabbed it!'); }
  catch(e){}
}
/* ---------- Discover ---------- */
async function renderDiscover(param){
  const v = document.getElementById('view');
  if (param && param.blogId) return renderBlogDetail(param.blogId);
  v.innerHTML = `<div class="sec-t">Trending blogs</div><div id="blogs"><div class="card"><div class="empty">Loading…</div></div></div>`;
  try {
    const blogs = listOf(await api('/blog/hot?current=1'));
    document.getElementById('blogs').innerHTML = blogs.length ? blogs.map(b=>`
      <div class="card blog" onclick="go('discover',{blogId:${b.id}})">
        <div class="ph">📸</div>
        <div class="t">${esc(b.title)}</div>
        <div class="meta"><span>❤️ ${b.liked||0}</span><span>💬 ${b.comments||0}</span><span>${esc((b.createTime||'').slice(0,10))}</span></div>
      </div>`).join('') : `<div class="card"><div class="empty">No blogs yet</div></div>`;
  } catch(e){}
}
async function renderBlogDetail(id){
  const v = document.getElementById('view');
  v.innerHTML = `<button class="back" onclick="go('discover')">‹ Back</button><div class="card"><div class="empty">Loading…</div></div>`;
  try {
    const b = await api(`/blog/${id}`);
    v.innerHTML = `<button class="back" onclick="go('discover')">‹ Back</button>
    <div class="card"><div class="sec-t" style="font-size:16px;line-height:1.5">${esc(b.title)}</div>
      <div class="meta" style="font-size:12px;color:#999;margin-bottom:10px">❤️ ${b.liked||0} · 💬 ${b.comments||0} · ${esc((b.createTime||'').slice(0,16).replace('T',' '))}</div>
      <div class="content-html">${b.content||''}</div>
      <div style="margin-top:14px"><button class="btn ghost" onclick="likeBlog(${b.id}, this)">❤️ Like (${b.liked||0})</button></div>
    </div>`;
  } catch(e){}
}
async function likeBlog(id, btn){
  try { await api(`/blog/like/${id}`, {method:'PUT', auth:true}); toast('Liked!'); btn.disabled = true; }
  catch(e){}
}
/* ---------- Me ---------- */
async function renderMe(){
  const v = document.getElementById('view');
  if (!store.token){
    v.innerHTML = `<div class="card"><div class="sec-t">Log in / Sign up</div>
      <div class="row"><input class="inp" id="email" placeholder="Email (this build logs in with email)"><button class="btn sm" id="codeBtn" style="white-space:nowrap" onclick="sendCode()">Send code</button></div>
      <input class="inp" id="code" placeholder="Verification code" inputmode="numeric">
      <button class="btn" onclick="doLogin()">Log in</button>
      <div class="hint">If the email never arrives after "Send code", that is expected — the code is in the backend log. On your Mac run:<br><code>grep 'Login verification code' ~/dianping-setup/app.log | tail -1</code><br>to see it.</div></div>`;
    return;
  }
  v.innerHTML = `<div class="card"><div class="empty">Loading…</div></div>`;
  try {
    const me = await api('/user/me', {auth:true});
    const cnt = await api('/user/sign/count', {auth:true}).catch(()=>null);
    v.innerHTML = `<div class="card"><div class="me-head">
        <div class="avatar">${esc((me.nickName||'U')[0])}</div>
        <div><div style="font-size:16px;font-weight:700">${esc(me.nickName||'User')}</div>
        <div style="font-size:12px;color:#999">id: ${me.id}</div></div></div>
      <div class="kv"><span class="k">Check-ins this month</span><span>${cnt==null?'-':cnt+' days'}</span></div>
      <div style="margin-top:12px;display:flex;gap:8px">
        <button class="btn sm" onclick="doSign()">📅 Check in</button>
        <button class="btn sm ghost" onclick="store.token=null;go('me')">Log out</button>
      </div></div>`;
  } catch(e){}
}
let codeCd = 0;
async function sendCode(){
  const email = document.getElementById('email').value.trim();
  if (!email || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ toast('Enter a valid email first'); return; }
  if (codeCd > 0) return;
  try {
    await api(`/user/code?phone=${encodeURIComponent(email)}`, {method:'POST'});
    toast('Code generated — check the backend log');
    codeCd = 60;
    const btn = document.getElementById('codeBtn');
    const iv = setInterval(()=>{ codeCd--; if(codeCd<=0){ clearInterval(iv); btn.disabled=false; btn.textContent='Send code'; } else { btn.disabled=true; btn.textContent=codeCd+'s'; } }, 1000);
  } catch(e){}
}
async function doLogin(){
  const email = document.getElementById('email').value.trim();
  const code = document.getElementById('code').value.trim();
  if (!email || !code){ toast('Email and code are both required'); return; }
  try {
    const token = await api('/user/login', {method:'POST', body:{phone:email, code}});
    store.token = token; toast('Logged in'); go('me');
  } catch(e){}
}
async function doSign(){
  try { await api('/user/sign', {method:'POST', auth:true}); toast('Checked in'); go('me'); }
  catch(e){}
}
/* ---------- Boot ---------- */
go('home');
</script>
</body>
</html>
